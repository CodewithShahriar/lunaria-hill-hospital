<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Deep Navy Gradient (Top-Left) -->
    <linearGradient id="navyGrad" x1="20%" y1="20%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#043c82" />
      <stop offset="50%" stop-color="#02316B" />
      <stop offset="100%" stop-color="#01224d" />
    </linearGradient>

    <!-- Deep Teal Gradient (Bottom-Right) -->
    <linearGradient id="tealGrad" x1="30%" y1="30%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#007a97" />
      <stop offset="50%" stop-color="#005C72" />
      <stop offset="100%" stop-color="#004354" />
    </linearGradient>

    <!-- Silver Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D realism -->
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#011b3d" flood-opacity="0.22" />
    </filter>

    <!-- Master Cross Clip Path with rounded corners -->
    <clipPath id="crossClip">
      <path d="
        M 43 10
        C 39 10, 36 13, 36 20
        L 36 36
        L 20 36
        C 13 36, 10 39, 10 46
        L 10 54
        C 10 61, 13 64, 20 64
        L 36 64
        L 36 80
        C 36 87, 39 90, 46 90
        L 54 90
        C 61 90, 64 87, 64 80
        L 64 64
        L 80 64
        C 87 64, 90 61, 90 54
        L 90 46
        C 90 39, 87 36, 80 36
        L 64 36
        L 64 20
        C 64 13, 61 10, 54 10
        Z
      " />
    </clipPath>
  </defs>

  <g filter="url(#logoShadow)">
    <g clip-path="url(#crossClip)">
      <!-- 1. Top-Left Navy Section -->
      <path
        d="M 0 0 L 100 0 L 64 10 C 64 20, 56 40, 48 50 C 40 60, 36 80, 36 90 L 0 100 Z"
        fill="url(#navyGrad)"
      />

      <!-- 2. Bottom-Right Teal Section -->
      <path
        d="M 100 100 L 0 100 L 36 90 C 36 80, 40 60, 48 50 C 56 40, 64 20, 64 10 L 100 0 Z"
        fill="url(#tealGrad)"
      />

      <!-- 3. Dynamic Curved Swoosh Separator (Silver/White highlight line) -->
      <path
        d="M 64 10 C 64 20, 56 40, 48 50 C 40 60, 36 80, 36 90"
        stroke="url(#swooshGrad)"
        stroke-width="3.5"
        stroke-linecap="round"
        fill="none"
      />

      <!-- 4. Soft Inner Bevel / Highlight on Top Left -->
      <path
        d="M 37 21 C 37 16, 40 12, 45 12 L 53 12"
        stroke="#ffffff"
        stroke-opacity="0.35"
        stroke-width="1.5"
        stroke-linecap="round"
        fill="none"
      />

      <!-- 5. Soft Inner Shadow on dividing seam -->
      <path
        d="M 62 12 C 62 21, 54 41, 46 51 C 38 61, 34 81, 34 88"
        stroke="#011b3d"
        stroke-opacity="0.25"
        stroke-width="1.2"
        fill="none"
      />
    </g>
  </g>
</svg>